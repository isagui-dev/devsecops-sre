name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest bandit

      - name: Run Pytest
        run: pytest app/test_app.py

      - name: Análisis SAST (Bandit)
        run: bandit -r app/ -x app/test_app.py

  deploy:
    needs: test-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Despliegue remoto por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 20m
          script: |
            cd /home/ubuntu/devsecops-sre
            git remote set-url origin https://github.com/isagui-dev/devsecops-sre.git
            git fetch origin main
            git reset --hard origin/main
            docker compose down
            docker compose up -d --build
